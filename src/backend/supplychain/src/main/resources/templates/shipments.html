<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/navbar :: head}">
  <title>All Shipments</title>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar(null)}"></nav>
<div class="page-wrapper"><div class="container">
  <div class="page-header flex items-center justify-between">
    <div>
      <h1 class="page-title">All Shipments</h1>
      <p class="page-subtitle">Complete list of all shipments in the system</p>
    </div>
    <div style="display:flex;gap:var(--sp-3);">
      <a href="/track" class="btn btn-secondary btn-sm">Search by Tracking #</a>
      <a href="/dashboard" class="btn btn-secondary btn-sm">Back to Dashboard</a>
    </div>
  </div>
  <div class="card animate-fade-in-up">
    <div class="table-wrapper">
      <table class="table">
        <thead><tr>
          <th>Tracking #</th><th>Cargo Type</th><th>Route</th>
          <th>Cold Chain</th><th>Location</th><th>Status</th>
        </tr></thead>
        <tbody>
          <tr th:each="s : ${shipments}">
            <td><a th:href="@{/track(trackingNumber=${s.trackingNumber})}" th:text="${s.trackingNumber}" style="color:var(--accent);font-weight:600;text-decoration:none;"></a></td>
            <td th:text="${s.cargoType}">-</td>
            <td th:if="${s.route != null}" th:text="${s.route.origin + 
'
 + s.route.destination}">-</td>
            <td th:unless="${s.route != null}" style="color:var(--text-muted);">No route</td>
            <td><span th:if="${s.coldChain}" class="badge badge-info">Yes</span><span th:unless="${s.coldChain}" class="badge" style="opacity:.5;">No</span></td>
            <td th:text="${s.currentLocation}">-</td>
            <td><span th:text="${s.status}" class="badge badge-success">-</span></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div style="padding:var(--sp-4) var(--sp-6);font-size:var(--text-xs);color:var(--text-muted);border-top:1px solid var(--border-subtle);">
      Showing <strong th:text="${#lists.size(shipments)}">0</strong> shipments
    </div>
  </div>
</div></div>
</body>
</html>
