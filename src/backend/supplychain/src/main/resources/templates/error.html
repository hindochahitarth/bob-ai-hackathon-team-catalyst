<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/navbar :: head}">
  <title>Error — FreightOS</title>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('error')}"></nav>

<div class="page-wrapper">
  <div class="container">
    <div style="min-height:60vh; display:flex; align-items:center; justify-content:center; padding:var(--sp-12) 0;">
      <div style="text-align:center; max-width:520px; width:100%;">

        <!-- Status code -->
        <div style="font-family:var(--font-mono); font-size:96px; font-weight:900; line-height:1;
                    color:var(--accent); opacity:0.18; user-select:none; margin-bottom:var(--sp-4);"
             th:text="${status ?: 500}">500</div>

        <!-- Icon -->
        <div style="font-size:48px; margin:-20px 0 var(--sp-4);">
          <span th:if="${status == 404}">🔍</span>
          <span th:unless="${status == 404}">⚠️</span>
        </div>

        <!-- Title -->
        <h1 style="font-size:var(--text-2xl); font-weight:700; color:var(--text-primary); margin:0 0 var(--sp-3);"
            th:text="${title ?: 'Something went wrong'}">Error</h1>

        <!-- Message -->
        <p style="font-size:var(--text-base); color:var(--text-secondary); margin:0 0 var(--sp-6); line-height:1.6;"
           th:text="${message ?: 'An unexpected error occurred.'}">
          Please try again.
        </p>

        <!-- Detail (small, muted) -->
        <div th:if="${detail != null and !#strings.isEmpty(detail)}"
             style="font-family:var(--font-mono); font-size:var(--text-xs); color:var(--text-muted);
                    background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius);
                    padding:var(--sp-3) var(--sp-4); margin-bottom:var(--sp-6); text-align:left;
                    word-break:break-word;"
             th:text="${detail}">detail</div>

        <!-- Actions -->
        <div style="display:flex; gap:var(--sp-3); justify-content:center; flex-wrap:wrap;">
          <a href="/dashboard" class="btn btn-primary">← Back to Dashboard</a>
          <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
        </div>

        <!-- Footer note -->
        <div style="margin-top:var(--sp-8); font-size:var(--text-xs); color:var(--text-muted);">
          FreightOS Supply Chain Intelligence · If this persists, contact your system administrator.
        </div>

      </div>
    </div>
  </div>
</div>
</body>
</html>
