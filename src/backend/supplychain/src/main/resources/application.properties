spring.application.name=supplychain

# ─────────────────────────────────────────────────────────────
# IBM watsonx.ai Integration
# Set these as environment variables — NEVER commit real values
# Required env vars:
#   WATSONX_API_KEY      — IBM Cloud API key
#   WATSONX_PROJECT_ID   — watsonx.ai Project ID
#   WATSONX_URL          — Regional endpoint (default: us-south)
#   WATSONX_MODEL_ID     — Granite model ID
# ─────────────────────────────────────────────────────────────
watsonx.api-key=${WATSONX_API_KEY:}
watsonx.project-id=${WATSONX_PROJECT_ID:}
watsonx.url=${WATSONX_URL:https://us-south.ml.cloud.ibm.com}
watsonx.model-id=${WATSONX_MODEL_ID:ibm/granite-3-8b-instruct}

# Ollama local IBM Granite (no API key needed)
# Run: ollama pull granite3.1-dense:2b
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:granite3.1-dense:2b}


# ─────────────────────────────────────────────────────────────
# Server — Railway injects PORT as an env var; default to 8080
# ─────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─────────────────────────────────────────────────────────────
# Error handling — surface unmapped URLs to @ControllerAdvice
# NOTE: spring.web.resources.add-mappings must stay TRUE (default)
#       or /css/style.css and all static files return 404.
#       throw-exception-if-no-handler-found only fires for
#       controller routes, not static resource paths.
# ─────────────────────────────────────────────────────────────
spring.mvc.throw-exception-if-no-handler-found=true

# ─────────────────────────────────────────────────────────────
# Spring Boot Actuator — health endpoint for Railway health checks
# ─────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ─────────────────────────────────────────────────────────────
# JPA / H2 — suppress the open-in-view warning on Railway logs
# ─────────────────────────────────────────────────────────────
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 console disabled in production (Railway)
spring.h2.console.enabled=false

