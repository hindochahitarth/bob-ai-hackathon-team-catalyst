submission:
  title: "Supply Chain Disruption Assistant & Cold Chain Monitor"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Supply chain disruptions such as weather events, port strikes, and
        geopolitical crises cascade across hundreds of active shipments in ways
        that are impossible to track manually, while fleet assets sit idle and
        cold chain shipments like vaccines risk spoiling from undetected
        temperature excursions discovered only after delivery.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    We built a system that automatically identifies which shipments are
        affected by an active disruption, recommends alternate routes or
        carriers using a graph-based shortest-path optimization model, surfaces
        idle fleet assets available for redeployment, monitors cold chain IoT
        sensor logs to detect and classify temperature excursions by regulatory
        severity before delivery, and gives customers a live shipment tracking
        portal. IBM Bob converts all flagged data into a single prioritized
        operations brief.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Automatic disruption-to-shipment impact matching"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Graph-based route optimization (Dijkstra's algorithm) for alternate route and carrier recommendation"
    - "Idle fleet asset identification for redeployment"
    - "Cold chain temperature excursion detection with regulatory severity classification"                               # optional 4th
    - "Customer-facing shipment tracking portal with live status and cold chain readings"                               # optional 5th
    - "AI-generated natural language operations brief via IBM Bob"

  tech_stack:
    languages: ["Java"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["Spring Boot", "Spring Data JPA", "Thymeleaf"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob", "watsonx.ai"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["H2"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Maven", "GitHub Actions"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The IBM Bob integration is genuinely load-bearing, not decorative — it
    synthesizes disruption impacts, idle fleet data, and cold chain breach
    severities into a single prioritized action brief, mirroring how a real
    operations manager would triage a crisis in seconds rather than manually
    sifting through separate tables. We also went beyond the base
    requirements by implementing a real graph-based optimization model for
    rerouting rather than simple rule matching, and adding a customer-facing
    tracking portal to make the system feel like a complete product.
  known_limitations: >                 # Optional but recommended — be honest about gaps
    Uses an in-memory H2 database with seeded sample data rather than live
    real-world shipment or sensor feeds. The route optimization model
    currently weighs routes by distance only and does not yet factor in
    cost, carrier reliability, or real-time traffic data. The application is
    not deployed to a live environment; the demo video shows it running
    locally.
